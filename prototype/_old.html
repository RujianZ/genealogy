<!doctype html>
<meta charset="utf-8">
<title>张氏宗谱 · 第一步验证（最丑版）</title>
<style>
  /* 故意保持难看。这一步只验数据模型，样式一律往后放。 */
  body{font-family:"Noto Serif SC",serif;font-size:13px;margin:0;line-height:1.55}
  #bar{padding:6px;border-bottom:2px solid #000;position:sticky;top:0;background:#fff;z-index:9}
  #cols{display:flex;align-items:flex-start}
  #cols>div{padding:6px;overflow:auto;height:calc(100vh - 215px);border-right:1px solid #999}
  #left{flex:0 0 26%} #mid{flex:0 0 42%} #right{flex:1}
  #src{position:fixed;bottom:0;left:0;right:0;height:150px;overflow:auto;
       border-top:3px solid #000;background:#ffd;padding:6px}
  a{cursor:pointer;color:#00c} h3{margin:8px 0 4px;background:#000;color:#fff;padding:2px 4px}
  .r1{background:#dfd}.r2{background:#efd}.r3{background:#ffd}.r4{background:#fed}
  .r5{background:#fdd;font-weight:bold;outline:1px solid #c00}
  .fork{border-left:4px solid #c00;padding-left:5px;margin:3px 0}
  .dead{background:#fcc;border:2px dashed #c00;padding:3px;margin:3px 0}
  .refrow{border-bottom:1px solid #dde;padding:2px 0;background:#f7f7ff}
  .orphan{background:#eef;border:1px solid #66c;padding:3px;margin:3px 0}
  .tier{background:#eee;border-top:1px solid #000;margin-top:6px;padding:2px;font-weight:bold}
  pre{white-space:pre-wrap;margin:2px 0;font-family:inherit}
  table{border-collapse:collapse;width:100%}td{border:1px solid #ccc;padding:1px 3px;vertical-align:top}
  td:first-child{width:6em;background:#f6f6f6}
</style>

<div id="bar">
  搜（名、字、讳、号都行，繁体简体都行）：
  <input id="q" size="16" value="火生">
  <button onclick="doSearch()">搜</button>
  <button onclick="setQ('承健')">承健</button>
  <button onclick="setQ('山林')">山林</button>
  <button onclick="focusPlace('云山')">云山</button>
  <button onclick="focusPlace('牌子山')">牌子山</button>
  <span id="stat"></span>
</div>
<div id="cols">
  <div id="left"><h3>① 搜到的（全部列出）</h3><div id="hits"></div></div>
  <div id="mid">
    <h3>② 往上是谁</h3>
    <label><input type="radio" name="vw" value="line" checked onchange="redraw()"> 两支对照</label>
    <label><input type="radio" name="vw" value="tree" onchange="redraw()"> 全部候选</label>
    <div id="anc"></div>
  </div>
  <div id="right"><h3>③ 这个人</h3><div id="card"></div></div>
</div>
<div id="src"><b>谱上原文</b><div id="srcbody">（点左边任意一个名字）</div></div>

<script type="module">
import { search } from '../src/core/search.ts';
import { buildIndex, walkUp, childrenOf, principalChain, compareLines,
         edgeNote, edgeDetail, countSameName } from '../src/core/lineage.ts';
import { searchReferenced, buildRefIndex, householdOf, displayName, relationLine, sameSurname }
  from '../src/core/referenced.ts';
import { foldingsUsed } from '../src/core/norm.ts';
import { buildPlaceTree, burialsOf, peopleAt, docsAbout, neighbours, chainOf }
  from '../src/core/places.ts';

const people = await (await fetch('../data/people.json')).json();
const refs   = await (await fetch('../data/referenced.json')).json();
const idx = buildIndex(people);
const { byRid, byHost } = buildRefIndex(refs);
const placeRecs = await (await fetch('../data/places.json')).json();
const shou      = await (await fetch('../data/shou.json')).json();
const placeTree = buildPlaceTree(placeRecs);
// 谱的页眉带是右起横排：「子长公林梦」倒过来是「梦林公长子」。
// 不改原文——两个都给，让人自己对。
// father_src 形如「页眉指向「子长公林梦」」，把外层说明剥掉只留原文
const srcText = t => (t || '').replace(/^页眉指向/, '').replace(/^「|」$/g, '').replace(/^行内$/, '写在这一行里');
const unreverse = t => {
  const m = /「([^」]+)」/.exec(t || ''); if (!m) return '';
  const r = [...m[1]].reverse().join('');
  return r === m[1] ? '' : '（右起横排，正着读是「' + r + '」）';
};
const tierName = v => v>=1?'名字完全一样':v>=0.85?'读音一样':v>=0.7?'名字里含这几个字':v>=0.6?'差一个字':v>=0.45?'写在生卒葬里':v>=0.4?'原文里提到':v>=0.3?'原文里提到':'可能只是碰巧';
const esc = s => (s ?? '').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const qEl = document.getElementById('q');
window.setQ = v => { qEl.value = v; doSearch(); };

// ── ① 搜索：全部渲染，没有 slice ──────────────────────────────
window.doSearch = () => {
  const hits = search(people, qEl.value);
  const tiers = new Map();
  for (const h of hits) { if (!tiers.has(h.score)) tiers.set(h.score, []); tiers.get(h.score).push(h); }
  const totalM = hits.reduce((a, h) => a + h.matches.length, 0);
  document.getElementById('stat').innerHTML =
    ' → <b>' + hits.length + '</b> 人 / <b>' + totalM + '</b> 处，<b>全部列出</b>'
    + '（一条不漏）';
  let html = '';
  for (const [score, list] of tiers) {
    html += '<div class="tier">' + tierName(score) + ' · ' + list.length + ' 人</div>';
    for (const h of list) {
      const p = h.person;
      html += '<div style="border-bottom:1px solid #ddd;padding:2px 0">'
        + '<a onclick="focusOn(\'' + p.pid + '\')">' + esc(p.name) + '</a> '
        + '<small>第' + p.gen + '世 ' + (p.zi ? '字' + esc(p.zi.text) : '') + '</small> '
        + (p.parent_edges.length === 0 ? '<b style="color:#66c" title="谱中无父边">孤</b>' : '')
        + (p.parent_edges.length > 1 ? '<b style="color:#c00">⑂' + p.parent_edges.length + '</b>' : '')
        + (h.matches.length > 1 ? ' <small style="color:#080">' + h.matches.length + '处</small>' : '')
        // 该人身上**每一处**命中都列出来，不只列最高分那条
        + h.matches.map(m => '<br><small>↳ ' + esc(m.why)
            
            + (m.snippet ? '<br>&nbsp;&nbsp;&nbsp;原文：' + esc(m.snippet) : '')
          + '</small>').join('')
        + '<br><small style="color:#888">' + esc(p.src_human) + '</small>'
        + '</div>';
    }
  }
  // ── 附记之人：她们必须被搜到本人，不是搜出她们的丈夫 ──────────
  const rhits = searchReferenced(refs, qEl.value);
  const rTot = rhits.reduce((a, h) => a + h.matches.length, 0);
  const rTiers = new Map();
  for (const h of rhits) { if (!rTiers.has(h.score)) rTiers.set(h.score, []); rTiers.get(h.score).push(h); }
  let rhtml = '<div class="tier" style="background:#446;color:#fff">妻、女、以及谱上提到但没有单独一条的人· '
    + rhits.length + ' 人 / ' + rTot + ' 处命中</div>';
  for (const [score, list] of rTiers) {
    rhtml += '<div class="tier">' + tierName(score) + ' · ' + list.length + ' 人</div>';
    for (const h of list) {
      const r = h.ref;
      rhtml += '<div class="refrow">'
        + '<a onclick="focusRef(\'' + r.rid + '\')">' + esc(displayName(r)) + '</a> '
        + '<small>' + esc(r.role) + (r.gen ? ' 第' + r.gen + '世' : '') + '</small>'
        + (r.form_ok ? '' : ' <b style="color:#c60" title="姓名形式认不出，原样保留">?</b>')
        + h.matches.map(m => '<br><small>↳ [' + esc(m.field) + '] ' + esc(m.why)
            + (m.snippet ? '<br>&nbsp;&nbsp;原文：' + esc(m.snippet) : '') + '</small>').join('')
        + '<br><small style="color:#888">' + esc(relationLine(r)) + '｜' + esc(r.src_human) + '</small>'
        + '</div>';
    }
  }

  // 用到了哪些繁简折叠——讲清楚为什么这两个写法算同一个
  const folds = foldingsUsed(qEl.value, '');
  const foldNote = folds.length
    ? '<div class="tier" style="background:#efe">繁体简体对照：' + folds.map(esc).join('；') + '</div>' : '';

  document.getElementById('stat').innerHTML =
    ' → 谱上单独一条的 <b>' + hits.length + '</b> 人 ／ 妻女等 <b>' + rhits.length + '</b> 人'
    + '，共 <b>' + (totalM + rTot) + '</b> 处，<b>全部列出</b>';
  document.getElementById('hits').innerHTML =
    foldNote + (html || '（没找到）') + rhtml;
  if (hits.length) focusOn(hits[0].person.pid);
  else if (rhits.length) focusRef(rhits[0].ref.rid);
};

// ── 葬地：每一层地名可点 ────────────────────────────────────
function burialRow(id) {
  const rs = burialsOf(placeRecs, id);
  if (!rs.length) return '<tr><td>葬</td><td><small>谱上没写</small></td></tr>';
  return '<tr><td>葬</td><td>' + rs.map(r => {
    const chain = chainOf(r);
    let acc = '';
    const links = chain.map((seg, i) => {
      acc = i ? acc + '·' + seg : seg;
      return '<a onclick="focusPlace(\'' + acc + '\')">' + esc(seg) + '</a>';
    }).join(' → ');
    const same = chain.length ? peopleAt(placeTree, chain.join('·')).length - 1 : 0;
    return '<div>' + (links || esc(r.text))
      + (r.pos ? '<small>（' + esc(r.pos) + '）</small>' : '')
      + (r.shape ? ' <small style="color:#666">形似' + esc(r.shape) + '</small>' : '')
      + (same > 0 ? ' <small>同葬还有 ' + same + ' 人</small>' : '')
      + '<br><small style="color:#888">' + esc(r.text) + '</small></div>';
  }).join('') + '</td></tr>';
}

// ── 一个地方：葬在这儿的人 + 卷首写它的篇目 ──────────────────
window.focusPlace = full => {
  const rs = neighbours(peopleAt(placeTree, full));
  const parts = full.split('·');
  // 面包屑，每一层都能回去
  let acc = '';
  const crumb = parts.map((seg, i) => {
    acc = i ? acc + '·' + seg : seg;
    return '<a onclick="focusPlace(\'' + acc + '\')">' + esc(seg) + '</a>';
  }).join(' → ');

  // 下一层还有哪些小地名
  let cur = placeTree.get(parts[0]);
  for (const seg of parts.slice(1)) cur = cur && cur.children.get(seg);
  const kids = cur ? [...cur.children.values()].sort((a, b) => b.count - a.count) : [];

  // 谱内自证的归并说明（云山＝多云山）
  const grp = rs.find(r => r.groups && r.groups.length)?.groups[0];

  // 卷首里写到这儿的篇目
  const ds = docsAbout(shou, parts[parts.length - 1]);

  let h = '<div style="background:#eee;padding:4px"><b>' + crumb + '</b>　'
    + rs.length + ' 人葬在这里</div>';
  if (grp) h += '<div style="background:#efe;padding:3px" title="' + esc(grp.note) + '">'
    + '<small>「' + esc(grp.via) + '」和「' + esc(grp.group) + '」是同一座山。'
    + '谱前面的《合户雜据》和《山图》都写了它的四至和形状。</small></div>';
  if (kids.length) h += '<div style="padding:3px">这里面还分：'
    + kids.map(k => '<a onclick="focusPlace(\'' + k.full + '\')">' + esc(k.name)
        + '</a><small>' + k.count + '</small>').join('　') + '</div>';
  if (ds.length) h += '<div style="padding:3px">谱前面写到这儿的：'
    + ds.map(d => '<a onclick="focusDoc(\'' + d.id + '\')">'
        + esc(d.title_read || d.title) + '</a><small>第' + d.page_from + '页</small>').join('　')
    + '</div>';

  h += '<div style="margin-top:4px">' + rs.map(r => {
    const isRef = r.owner.includes('/');
    const go = isRef ? 'focusRef' : 'focusOn';
    return '<div style="border-bottom:1px dotted #ccc">'
      + '<small>第' + (r.gen ?? '?') + '世</small> '
      + '<a onclick="' + go + '(\'' + r.owner + '\')">' + esc(r.owner_name) + '</a>'
      + '<br><small style="color:#888">' + esc(r.text) + '</small></div>';
  }).join('') + '</div>';
  document.getElementById('anc').innerHTML = h;
};

// ── 卷首某一篇 ──────────────────────────────────────────────
window.focusDoc = id => {
  const d = shou.find(x => x.id === id);
  document.getElementById('anc').innerHTML =
    '<div style="background:#eee;padding:4px"><b>' + esc(d.title_read || d.title) + '</b>'
    + (d.title_read ? '<small>　谱上写作「' + esc(d.title) + '」，右起横排</small>' : '')
    + '<br><small>卷首 第' + d.page_from + '–' + d.page_to + '页，' + d.chars + '字</small></div>'
    + (d.mentions.length ? '<div style="padding:3px"><small>提到的地方：'
        + d.mentions.map(m => '<a onclick="focusPlace(\'' + m + '\')">' + esc(m) + '</a>').join('　')
        + '</small></div>' : '')
    + '<pre style="padding:4px">' + esc(d.text) + '</pre>';
};

// ── 附记之人的卡片：她/他自己的一页 ──────────────────────────
window.focusRef = rid => {
  const r = byRid.get(rid);
  const host = idx.get(r.host);
  const f = (label, v) => v ? '<tr><td>' + label + '</td><td>' + esc(v.text) + '</td></tr>' : '';
  const same = sameSurname(refs, r);

  let h = '<b style="font-size:19px">' + esc(displayName(r)) + '</b> '
    + '<small>' + esc(r.role) + '</small>'
    + '<div class="orphan">'
    + '<small>' + esc(relationLine(r)) + '</small></div>'
    + '<table>'
    + '<tr><td>谱上写作</td><td><b>' + esc(r.name_raw || '（谱未书名）') + '</b>'
      + (r.form_ok ? '' : '<br><small style="color:#c60">这几个字不像名字，按原样保留</small>') + '</td></tr>'
    + (r.rel_raw ? '<tr><td>关系词</td><td>' + esc(r.rel_raw) + '　<small>' + esc(r.rel_class) + '</small></td></tr>' : '')
    + (r.surname ? '<tr><td>姓</td><td>' + esc(r.surname) + '</td></tr>' : '')
    + (r.given ? '<tr><td>名</td><td>' + esc(r.given) + '</td></tr>' : '')
    + (r.husband_surname ? '<tr><td>夫家姓</td><td>' + esc(r.husband_surname) + '</td></tr>' : '')
    + f('生', r.birth) + f('殁', r.death) + burialRow(r.rid)
    + '<tr><td>记在谁名下</td><td><a onclick="focusOn(\'' + r.host + '\')">'
      + esc(r.host_name) + '</a> 第' + (host ? host.gen : '?') + '世'
      + '<br><small></small></td></tr>'
    + '<tr><td>同姓的其他配偶</td><td>' + (same.length
        ? same.length + ' 位<small>（同姓）</small>'
        : '—') + '</td></tr>'
    + '</table>';

  if (r.narrative_candidates.length) {
    h += '<div class="dead">⚑ 疑似记述本人、但写在' + esc(r.host_name) + '条目里的段落 '
      + r.narrative_candidates.length + ' 段——<b>只标候选，未判定归属</b>：'
      + r.narrative_candidates.map(n => '<div style="margin-top:3px">「' + esc(n.text.replace(/\n/g, '｜'))
          + '」<br><small>依据：' + esc(n.why) + '<br>' + esc(n.note) + '</small></div>').join('')
      + '</div>';
  }
  h += '<small></small>';
  document.getElementById('card').innerHTML = h;

  document.getElementById('anc').innerHTML =
    '<div style="background:#eee;padding:3px">附记之人没有自己的上溯链——谱不记女方娘家，'
    + '也不记幽灵子的下一代。下面是<b>记在谁名下</b>的链。</div>' + renderLines(r.host);

  document.getElementById('srcbody').innerHTML =
    '<b>出处：</b>' + esc(r.src_human) + '　<small>rid ' + esc(r.rid) + '　宿主 ' + esc(r.host) + '</small>'
    + '<br><small>下面是宿主条目原文，她/他的记载就在其中：</small>'
    + '<pre>' + esc(r.host_raw_text) + '</pre>';
};

// ── ②-a 主线对照：血缘线 vs 宗法线 ───────────────────────────
function renderLines(pid) {
  const blood = principalChain(idx, pid, '血缘线');
  const law   = principalChain(idx, pid, '宗法线');
  const cmp   = compareLines(blood, law);
  const col = (chain, title) => {
    let s = '<div style="flex:1;min-width:0"><b>' + title + '</b>（' + chain.length + '代）';
    for (const st of chain) {
      const p = st.person;
      s += '<div style="border-bottom:1px dotted #ccc">'
        + '<a onclick="focusOn(\'' + p.pid + '\')">第' + p.gen + '世 <b>' + esc(p.name) + '</b></a> '
        + '<small>' + (p.zi ? '字' + esc(p.zi.text) : '') + '</small>'
        + (st.ambiguous ? ' <b style="color:#c00" title="这一步有 ' + st.alternatives.length
             + ' 个候选，切到「全部候选」看全">⑂' + st.alternatives.length + '</b>' : '')
        + (st.taken ? (() => {
            const n = edgeNote(st.taken, countSameName(people, st.taken.parent_name));
            return '<br><small class="r' + st.taken.rank + '" title="' + esc(edgeDetail(st.taken)) + '">'
              + '↑' + esc(st.taken.kind)
              + (n.text ? (n.loud ? '　<b style="color:#c00">注意：' + esc(n.text) + '</b>'
                                  : '　' + esc(n.text)) : '')
              + '</small>';
          })() : '')
        + '</div>';
      if (st.deadEnd) s += '<div class="dead">注意：' + esc(st.deadEnd.reason)
        + '<br><small>谱上写的是「' + esc(st.deadEnd.filiation) + '」，书页上方写着「' + esc(srcText(st.deadEnd.fatherSrc)) + '」' + esc(unreverse(st.deadEnd.fatherSrc)) + '</small>'
        + '</div>';
    }
    return s + '</div>';
  };
  // 说人话：不写「分叉／合回／未走到合回点」这种词。
  const head = cmp.divergeAt
    ? '往上到<b>第' + cmp.divergeAt + '世</b>，因为有一次过继，分成了两支'
      + (cmp.rejoinAt ? '；再往上到<b>第' + cmp.rejoinAt + '世</b>又是同一个人。'
                      : '。谱上这一支往上到这里就没有了。')
    : '往上一路都是同一支，没有过继。';
  return '<div style="background:#eee;padding:3px">' + head + '</div>'
    + '<div style="display:flex;gap:5px">'
    + col(blood, '亲生这一支') + col(law, '谱上挂的这一支') + '</div>';
}

// ── ②-b 全部候选：每条 parent_edge 都画，绝不取第一条 ─────────
function renderNode(n, depth) {
  const p = n.person, pad = depth * 9;
  let h = '<div style="margin-left:' + pad + 'px">'
    + '<a onclick="focusOn(\'' + p.pid + '\')"><b>第' + p.gen + '世 ' + esc(p.name) + '</b></a>'
    + (p.zi ? '（字' + esc(p.zi.text) + '）' : '')
    + (p.is_heir ? ' <small>[嗣子]</small>' : '') + '</div>';
  if (n.deadEnd) h += '<div class="dead" style="margin-left:' + pad + 'px">注意：' + esc(n.deadEnd.reason)
    + '<br><small>谱上写的是「' + esc(n.deadEnd.filiation) + '」，书页上方写着「' + esc(srcText(n.deadEnd.fatherSrc)) + '」' + esc(unreverse(n.deadEnd.fatherSrc)) + '</small>'
    + '</div>';
  if (n.branches.length > 1) h += '<div style="margin-left:' + pad + 'px">'
    + '<b style="color:#c00">这里有 ' + n.branches.length + ' 个可能的父亲，谱上没说是哪一个，全列在下面：</b></div>';
  for (const b of n.branches) {
    const e = b.edge, pname = e.parent_name || idx.get(e.parent)?.name || '(名缺，见 pid)';
    h += '<div class="fork r' + e.rank + '" style="margin-left:' + (pad + 5) + 'px">'
      + '<b>' + esc(e.kind) + '</b> → ' + esc(pname)
      + (() => {
          const n = edgeNote(e, countSameName(people, e.parent_name));
          return n.text ? (n.loud ? ' <b style="color:#c00">注意：' + esc(n.text) + '</b>'
                                  : ' <small>' + esc(n.text) + '</small>') : '';
        })()
      
      + '<br><small>父出处：' + esc(e.parent_src) + '</small>'
      + (b.stop ? '<br><small>到此为止：' + esc(b.stop) + '</small>' : '') + '</div>';
    if (b.node) h += renderNode(b.node, depth + 1);
  }
  return h;
}

// ── ③ 人物卡：全字段 + 孤儿 + 杂七杂八一律摆出来 ──────────────
window.redraw = () => focusOn(window.__pid);
window.focusOn = pid => {
  window.__pid = pid;
  const p = idx.get(pid);
  const mode = document.querySelector('input[name=vw]:checked').value;
  document.getElementById('anc').innerHTML =
    mode === 'tree' ? renderNode(walkUp(idx, pid), 0) : renderLines(pid);

  const f = (label, v) => v ? '<tr><td>' + label + '</td><td>' + esc(v.text ?? v) + '</td></tr>' : '';
  const kids = childrenOf(people, pid);
  // 父亲声明了、但谱中没有条目指回来的儿子——这类「查无此人」也必须显示
  const linked = new Set(kids.map(k => k.child.name));
  const ghosts = p.sons_claimed.filter(n => !linked.has(n.replace(/[\s　]/g, '')));

  let h = '<b style="font-size:19px">' + esc(p.name) + '</b> 第' + p.gen + '世 '
    + '<small>谱上写作「' + esc(p.name_raw) + '」</small>';
  if (p.parent_edges.length === 0) {
    h += '<div class="orphan">谱上没有接上父亲。'
      + (p.father_name
          ? '谱上写父名「' + esc(p.father_name) + '」' + esc(p.filiation)
            + '。谱上另写着「' + esc(srcText(p.father_src)) + '」' + esc(unreverse(p.father_src)) + '，但谱里没有他单独的一条。'
          : '谱上未写父名。')
      + '</div>';
  }
  h += '<table>'
    + f('字', p.zi) + f('讳', p.hui) + f('号', p.hao) + f('名', p.ming)
    + f('生', p.birth) + f('殁', p.death) + f('寿', p.age)
    // 葬地不再只读 burial 字段——那个字段只有三分之一的人有值。
    // 这里用归拢过的 data/places.json，四个来源合并，每一层地名都能点。
    + burialRow(pid)
    + '<tr><td>谱上写的父亲</td><td>' + (esc(p.father_name) || '谱上没写') + '　' + esc(p.filiation)
      + '<br><small>' + esc(p.father_src) + '</small></td></tr>'
    + '<tr><td>过继来的？</td><td>' + (p.is_heir ? '是。亲生父亲和谱上的父亲是两个人' : '否') + '</td></tr>'
    + p.spouses.map(s => '<tr><td>' + esc(s.rel) + '</td><td>' + esc(s.name_raw)
        + (s.birth ? '<br><small>生' + esc(s.birth.text) + '</small>' : '')
        + (s.death ? '<br><small>殁' + esc(s.death.text) + '</small>' : '')
        + (s.burial ? '<br><small>' + esc(s.burial.text) + '</small>' : '') + '</td></tr>').join('')
    + '<tr><td>谱上列的儿子</td><td>' + (p.sons_claimed.map(esc).join('、') || '—')
      + (ghosts.length ? '<br><small style="color:#c00">⚑ 其中 ' + ghosts.map(esc).join('、')
          + ' 在谱中查无条目指回——照录，不删</small>' : '') + '</td></tr>'
    + '<tr><td>女（只有夫家姓）</td><td>' + (p.daughters_claimed.map(esc).join('、') || '—') + '</td></tr>'
    + '<tr><td>子女</td><td>' + (kids.map(k =>
        '<a onclick="focusOn(\'' + k.child.pid + '\')">' + esc(k.child.name) + '</a>'
        + '<small>(' + esc(k.edge.kind) + ')</small>').join('、') || '—') + '</td></tr>'
    // 这一户里没有独立条目的人——每个都点得进去，有自己的一页
    + (() => {
        const hh = householdOf(byHost, p);
        if (!hh.length) return '';
        return '<tr><td>同一家的人<br><small>妻、女等</small></td><td>'
          + hh.map(r => '<div><a onclick="focusRef(\'' + r.rid + '\')">'
              + esc(displayName(r)) + '</a> <small>' + esc(r.role)
              + (r.rel_raw ? '·' + esc(r.rel_raw) : '')
              + (r.form_ok ? '' : '　<b style="color:#c60" title="姓名形式认不出">?</b>') + '</small></div>').join('')
          + '</td></tr>';
      })()
    + (p.titles.length ? '<tr><td>功名</td><td>' + p.titles.map(esc).join('、') + '</td></tr>' : '')
    + (p.marks.length ? '<tr><td>标记</td><td>' + p.marks.map(m =>
        esc(m.tag) + (m.text ? '：' + esc(m.text) : '')).join('<br>') + '</td></tr>' : '')
    + (p.unparsed.length ? '<tr><td>其余原文<br><small>照抄，没改</small></td><td>'
        + p.unparsed.map(u => '<div>· ' + esc(u.text)
            + ' <small>(seq' + u.seq + '·p' + u.page + ')</small></div>').join('') + '</td></tr>' : '')
    + '</table>'
    + '<small>生卒原样显示，不做年号换算（CLAUDE.md 第四节）。「缺」「未详」是编谱人写下的，不是空值。</small>';
  document.getElementById('card').innerHTML = h;

  document.getElementById('srcbody').innerHTML =
    '<b>出处：</b>' + esc(p.src_human) + '　<small>pid ' + esc(p.pid) + '</small>'
    + '<pre>' + esc(p.raw_text) + '</pre>';
};

doSearch();
</script>
