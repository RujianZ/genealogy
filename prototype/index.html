<!doctype html>
<meta charset="utf-8">
<title>张氏宗谱 · 胜二户</title>
<style>
/* ─────────────────────────────────────────────────────────────
   取色自卷首封面（Pillow 采样）：红 #660000、金 #C08C10。
   不自己调「中国红」——封面上就是这个深枣红。配宣纸米色与墨黑。
   宋体。不用圆角、不留大白、高密度。
   ───────────────────────────────────────────────────────────── */
:root{
  --red:#660000; --gold:#C08C10;
  --paper:#F4EFE4; --paper-2:#EDE6D6; --paper-3:#E3DAC6;
  --ink:#1C1A17; --ink-2:#4A453C; --ink-3:#7A7263;
  --line:#C9BFA8;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:15px/1.7 "Noto Serif SC","Source Han Serif SC","Songti SC",SimSun,serif;
  display:flex; flex-direction:column;
}
a{color:var(--red); text-decoration:none; cursor:pointer;
  border-bottom:1px solid rgba(102,0,0,.25)}
a:hover{background:rgba(102,0,0,.07); border-bottom-color:var(--red)}
small{font-size:12.5px; color:var(--ink-2)}
.dim{color:var(--ink-3)}
.raw{color:var(--ink-2); font-size:12.5px}

#top{
  background:var(--red); color:var(--paper); padding:7px 14px;
  display:flex; align-items:center; gap:14px; flex:none;
  border-bottom:3px solid var(--gold);
}
#top .name{font-size:17px; letter-spacing:.14em; white-space:nowrap}
#top .sub{font-size:12px; opacity:.7; letter-spacing:.1em}
#back{
  background:none; border:1px solid rgba(244,239,228,.45); color:var(--paper);
  font:inherit; font-size:13px; padding:2px 11px; cursor:pointer;
}
#back:disabled{opacity:.3; cursor:default}
#back:not(:disabled):hover{background:rgba(244,239,228,.14)}
#q{
  flex:1; max-width:470px; font:inherit; font-size:15px;
  padding:4px 10px; border:none; background:var(--paper); color:var(--ink);
}
#q:focus{outline:2px solid var(--gold)}
#qhint{font-size:12px; opacity:.65}

/* 单栏。一个人的事全在一栏里从上往下读完——
   配偶、子女、记事、出处，本来就都是「这个人的事」，
   拆成三栏反而要来回扫。世系树是另一页，从上面那条世系条点进去。 */
#main{display:flex; flex:1; min-height:0}
#main>section{overflow:auto; min-width:0}
#subject{flex:1; position:relative}
#col{max-width:760px; margin:0 auto; padding:16px 24px 28px}

h2{font-size:13px; letter-spacing:.22em; color:var(--red); margin:22px 0 7px;
   font-weight:600; border-bottom:1px solid var(--line); padding-bottom:3px}
h2:first-child{margin-top:0}

.step{padding:1px 10px 1px 12px; line-height:1.45}
.step .gen{font-size:11px; color:var(--ink-3); display:inline-block; width:2.6em}
.step .nm{font-size:15px}
.step.now{background:var(--red)}
.step.now .nm{color:var(--paper); border-bottom-color:rgba(244,239,228,.4)}
.step.now .gen{color:rgba(244,239,228,.75)}
.step .zi{font-size:11.5px; color:var(--ink-3); margin-left:.3em}
.step.now .zi{color:rgba(244,239,228,.75)}
.rail{border-left:1px solid var(--line); margin-left:24px; height:7px}
.alt{margin:2px 8px 2px 24px; padding:3px 8px; border-left:3px solid var(--gold);
     background:rgba(192,140,16,.12); font-size:12.5px; line-height:1.5}
.alt.warn{border-left-color:var(--red); background:rgba(102,0,0,.08)}
.brk{margin:5px 8px; padding:6px 8px; border:1px solid var(--red);
     background:rgba(102,0,0,.06); font-size:12.5px; line-height:1.6}
/* 算出来的结论。语气要平——是摆算式，不是报警。 */
.calc{margin:5px 0 2px; padding:6px 9px; border-left:2px solid var(--ink-3);
      background:rgba(28,26,23,.04); font-size:12.5px; line-height:1.65; color:var(--ink-2)}
.calc b{color:var(--ink); font-weight:600}
/* 年纪上当不了父亲的候选：**淡显，但照样列着、照样能点。** */
a.out{opacity:.45; text-decoration:line-through 1px}
a.out:hover{opacity:1}

.title{font-size:30px; line-height:1.25; margin:0; font-weight:600}
.title .gen{margin-left:.6em;font-size:14px; color:var(--red); letter-spacing:.1em; margin-left:.6em; font-weight:400}
.byline{color:var(--ink-2); font-size:13px; margin:2px 0 14px}
dl{display:grid; grid-template-columns:4.8em 1fr; margin:0}
dt{color:var(--ink-3); font-size:13px; padding:3px 0; border-top:1px solid var(--line)}
dd{margin:0; padding:3px 0 3px 4px; border-top:1px solid var(--line)}
.tag{display:inline-block; padding:0 5px; font-size:11.5px; background:var(--paper-3);
     color:var(--ink-2); margin-right:4px}
.tag.hot{background:var(--red); color:var(--paper)}
.tag.gold{background:var(--gold); color:#3a2a00}

/* 单栏下人多的时候排成几列，省得一个名字占一整行 */
.rows{display:grid; grid-template-columns:repeat(auto-fill,minmax(196px,1fr));
      gap:0 18px}
.row{padding:2px 0; border-bottom:1px solid rgba(201,191,168,.5); font-size:13.5px}

/* ── 人物页顶上那一条：我在哪 ───────────────────────── */
.linebar{display:flex; align-items:baseline; flex-wrap:wrap; gap:0 2px;
  margin:0 0 14px; padding:6px 0 8px; border-bottom:1px solid var(--line); font-size:13.5px}
.linebar .dim{font-size:11px}
.linebar b{color:var(--red)}
.lk{margin-left:auto; font:inherit; font-size:12.5px; color:var(--red);
  background:none; border:1px solid var(--line); padding:2px 9px; cursor:pointer}
.lk:hover{background:var(--paper-2); border-color:var(--red)}

/* ── 世系树整页：最早的一代在最上，一路往下到你 ──────── */
.tree{margin-top:14px}
.trow{display:flex; align-items:stretch; border-top:1px solid rgba(201,191,168,.55)}
.tgen{flex:0 0 30px; padding:7px 0 0; font-size:11px; color:var(--ink-3); text-align:right;
      padding-right:10px}
.tcells{flex:1; display:flex; gap:0}
.trow.two .tcells{gap:1px; background:var(--line)}
.trow.two .tcell{flex:1 1 0; background:var(--paper); padding-left:10px}
.tcell{padding:6px 0 7px; min-width:0}
.tcell.now{background:rgba(192,140,16,.13)}
.tcell .nm{font-size:16px}
.tcell.now .nm{font-weight:700}
.tlab{display:inline-block; margin-right:7px; font-size:10.5px; letter-spacing:.14em;
      color:var(--red); border:1px solid var(--red); padding:0 4px; vertical-align:2px}
.tmark{margin:9px 0 0; padding:3px 0 3px 40px; font-size:12px; color:var(--red);
       letter-spacing:.1em; border-top:2px solid var(--red)}
.tfork{margin:4px 0 2px; padding:5px 8px; border-left:2px solid var(--gold);
       background:rgba(192,140,16,.10); font-size:12.5px; line-height:1.6}
/* 谱自己已经写清楚了（印在正上一格）——只是顺带交代同名的另一位，不是警示。 */
.tfork.calm{border-left-color:var(--ink-3); background:rgba(0,0,0,.035); color:var(--ink-2)}
/* 谱自己的规矩就对不上的（世次差不是 1、生年不可能）。收着，但没删。 */
.tdim{margin:3px 0 2px; font-size:12px; color:var(--ink-3); line-height:1.6}

/* ── 文言原文 + 今译，一段对一段 ─────────────────────── */
.tnote{margin:12px 0 4px; padding:6px 9px; border-left:2px solid var(--ink-3);
       background:rgba(28,26,23,.04); font-size:12.5px; line-height:1.65; color:var(--ink-2)}
.tnote b{color:var(--ink); font-weight:600}
.bi{margin-top:10px}
.bir{padding:11px 0; border-bottom:1px solid rgba(201,191,168,.55)}
/* 原文：大一点，宋体，是主角 */
.bir .src{font-size:16.5px; line-height:1.95; letter-spacing:.03em}
/* 今译：小一点、退后一步。它是搭在旁边的，不是原文 */
.bir .cn{margin-top:5px; padding-left:11px; border-left:2px solid var(--gold);
         font-size:13.5px; line-height:1.8; color:var(--ink-2)}
.plainname{color:var(--ink-2); border-bottom:1px dotted var(--ink-3)}
.pnote{margin-top:7px; font-size:12.5px; line-height:1.75; color:var(--ink-3)}
.pnote b{color:var(--ink-2)}
@media(min-width:900px){
  .bir{display:grid; grid-template-columns:1fr 1fr; gap:0 20px; align-items:start}
  .bir .cn{margin-top:0; border-left:1px solid var(--line); padding-left:20px}
}

#results{position:absolute; inset:0; z-index:20; background:var(--paper);
  overflow:auto; padding:12px 20px}
#results.hide{display:none}
.grp{margin:14px 0 4px; font-size:12px; letter-spacing:.18em; color:var(--red);
     border-bottom:1px solid var(--line); padding-bottom:2px}
.hit{padding:3px 0; border-bottom:1px solid rgba(201,191,168,.45)}
.why{font-size:12px; color:var(--ink-3)}
mark{background:var(--gold); color:#2a1e00; padding:0 1px}

/* 原文栏跟着内容长，短的时候不占地方；长的封顶滚动 */
#raw{flex:none; max-height:168px; overflow:auto; background:var(--paper-3);
  border-top:1px solid var(--line); padding:7px 20px; font-size:13px}
#raw .src{color:var(--red); font-size:12px; letter-spacing:.06em}
#raw pre{white-space:pre-wrap; margin:3px 0 0; font-family:inherit; color:var(--ink-2)}

.dbt{padding:8px 0; border-bottom:1px solid rgba(201,191,168,.55)}
.dbt .q{font-size:13px; color:var(--ink-2); margin-top:2px}
.dbt .c{margin:2px 0 0 14px; font-size:13.5px}
/* 谱把他印在正上方那一格——翻开那页就看见 */
.dbt .c.up{background:rgba(192,140,16,.14); padding:2px 6px; margin-left:8px}
.dbt .c.up b{color:var(--red); font-size:12px}

/* ── 事迹原文里可点的要素 ─────────────────────────── */
.ent{border-bottom:1px solid rgba(102,0,0,.3)}
.ent.place{color:#2d5016; border-bottom-color:rgba(45,80,22,.35)}
.ent.year{color:#7a5c00; border-bottom-color:rgba(122,92,0,.35)}
/* 证据弱的（只对上字号，或世次差得远）：虚线，鼠标停上去说明凭什么 */
.ent.weak{border-bottom-style:dotted; opacity:.8}

a.maybe{color:var(--ink);border-bottom:1px dotted var(--ink-3)}
a.maybe:hover{color:var(--red);border-bottom-color:var(--red)}
a.warn{color:#8a2b2b;border-bottom-style:dashed}
.prose{font-size:15.5px;line-height:2.05;white-space:pre-wrap;margin:2px 0 10px}
.foot{margin-top:14px;padding-top:6px;border-top:1px solid var(--line)}
.cloud{line-height:2.2;margin-bottom:6px}
#catbtn{background:none;border:1px solid rgba(244,239,228,.45);color:var(--paper);
  font:inherit;font-size:13px;padding:2px 11px;cursor:pointer}
#catbtn:hover{background:rgba(244,239,228,.14)}

.pic{max-width:100%;border:1px solid var(--line);margin:6px 0 12px;display:block}
.hero{border-bottom:2px solid var(--red);padding-bottom:10px;margin-bottom:14px}
.hero-t{font-size:26px;letter-spacing:.1em;color:var(--red);font-weight:600}
.hero-s{font-size:13px;color:var(--ink-2);margin-top:3px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line)}
.card{background:var(--paper);padding:9px 12px;cursor:pointer}
.card:hover{background:#fff}
.card-t{font-size:16px;color:var(--red);font-weight:600}
.card-n{float:right;font-size:12px;color:var(--ink-3);font-weight:400}
.card-d{font-size:12.5px;color:var(--ink-2);line-height:1.6;margin-top:2px}
.advbar{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.btn{font:inherit;font-size:14px;padding:3px 18px;cursor:pointer;
  background:var(--red);color:var(--paper);border:1px solid var(--red)}
.btn:hover{background:#7d0d0d}
.btn.ghost{background:none;color:var(--red)}
.btn.ghost:hover{background:rgba(102,0,0,.08)}
.advgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:6px}
.advrow{background:var(--paper);padding:4px 8px;display:flex;align-items:center;gap:8px}
.advrow label{font-size:12.5px;color:var(--ink-3);white-space:nowrap;width:6.5em}
.advrow input{flex:1;min-width:0;font:inherit;font-size:14px;border:none;
  background:transparent;color:var(--ink);padding:2px 0;border-bottom:1px solid var(--line)}
.advrow input:focus{outline:none;border-bottom-color:var(--red)}
.kinpick{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
  border:1px solid var(--line);margin-bottom:6px}
.slot{background:var(--paper);padding:8px 12px;cursor:pointer;min-height:54px}
.slot.on{background:#fff;box-shadow:inset 3px 0 0 var(--red)}
.slot-l{font-size:12px;color:var(--ink-3)}
/* ── 关系计算器：每格自带输入框，不抢顶栏那个搜索框 ── */
.slot{cursor:default}
.kinq{width:100%; font:inherit; font-size:15px; padding:5px 8px; margin-top:3px;
      border:1px solid var(--line); background:var(--paper)}
.kinq:focus{outline:2px solid var(--gold)}
.kinhits{margin-top:5px; max-height:200px; overflow:auto}
.kinhits .hit{padding:3px 0}
.kinname{font-size:17px; display:flex; align-items:baseline; gap:8px;
         flex-wrap:wrap; margin-top:2px}
.kinname .lk{margin-left:auto}
.kinres{border:1px solid var(--red);background:rgba(102,0,0,.05);padding:10px 12px;margin:10px 0}
.kinbig{font-size:19px;line-height:1.5}
.kinbig b{color:var(--red);font-size:23px}
.grp2{margin:10px 0 3px;font-size:13px;color:var(--ink-2);font-weight:600}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:8px}
.gal figure{margin:0;cursor:pointer}
.gal img{width:100%;height:170px;object-fit:cover;border:1px solid var(--line);display:block}
.gal figure:hover img{border-color:var(--red)}
.gal figcaption{font-size:12px;color:var(--ink-2);padding-top:2px;line-height:1.4}
/* ── 加载页：一本书从中缝摊开。五秒。只在进入／刷新时出现一次 ──
   封面切成左右两半，各绕自己**外侧**那条边向外转开，
   中缝分开、两边摊平——就是把书摊开的样子。
   （原先是整幅绕左边缘转 158°，看着像左边翻成了右边，不是摊开。）
   不做水墨、卷轴、毛笔那些——CLAUDE.md 第六节说了，一次就够。 */
#splash{position:fixed; inset:0; background:#3d0000; z-index:99;
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  transition:opacity .7s ease}
#splash .stage{perspective:2200px; perspective-origin:50% 50%;
  animation:rise .8s ease-out both}
/* 左边封底、右边封面——本来就是这本书的左右两边，中间那道是书脊 */
#splash .book{position:relative; width:min(62vw,520px); aspect-ratio:1800/1211;
  transform-style:preserve-3d}
#splash .leaf{position:absolute; top:0; width:50%; height:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.65)}
#splash .leaf img{width:100%; height:100%; display:block; object-fit:cover}
/* 各绕外侧那条边向外摊开，停在 72°——**转过 90° 就背面朝外、整个看不见了**，
   那读起来是「书没了」，不是「摊开」。停在 72° 还看得见，再整体淡出。 */
#splash .leaf.l{left:0;   transform-origin:left center;
  animation:openL 1.5s cubic-bezier(.5,.02,.28,1) 3.1s both}
#splash .leaf.r{left:50%; transform-origin:right center;
  animation:openR 1.5s cubic-bezier(.5,.02,.28,1) 3.1s both}
/* 中缝：合着的时候有一道暗影，摊开时跟着淡掉 */
#splash .gutter{position:absolute; top:0; bottom:0; left:calc(50% - 7px); width:14px;
  background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.55),rgba(0,0,0,0));
  animation:fadeout .6s ease-out 3.1s both}
#splash .tip{margin-top:26px; font-size:12.5px; letter-spacing:.26em;
  color:rgba(244,239,228,.62);
  animation:fadein 1s ease-out .5s both}
@keyframes rise{from{opacity:0; transform:translateY(14px) scale(.985)} to{opacity:1}}
@keyframes fadein{from{opacity:0} to{opacity:1}}
@keyframes fadeout{from{opacity:1} to{opacity:0}}
/* 各绕自己外侧那条边向外转开，转过 90° 之后就背对着看不见了 */
@keyframes openL{
  0%{transform:rotateY(0)}
  100%{transform:rotateY(-72deg)}
}
@keyframes openR{
  0%{transform:rotateY(0)}
  100%{transform:rotateY(72deg)}
}
@media (prefers-reduced-motion:reduce){
  #splash .stage,#splash .book,#splash .leaf,#splash .gutter,#splash .tip{animation:none}
}
</style>

<div id="splash">
  <div class="stage">
    <div class="book">
      <div class="leaf l"><img src="img/book-back.jpg" alt=""></div>
      <div class="leaf r"><img src="img/book-front.jpg" alt="张氏宗谱 封面"></div>
      <div class="gutter"></div>
    </div>
  </div>
  <div class="tip">湖北黄梅 · 胜二户 · 南宋宝庆丁亥（1227）迁梅至今</div>
</div>

<div id="top">
  <span class="name"><b>张氏宗谱</b> <span class="sub">胜二户</span></span>
  <button id="back" onclick="goBack()" disabled>← 返回</button>
  <button id="catbtn" onclick="nav('home')">首页</button>
  <button id="catbtn" onclick="nav('adv')">高级搜索</button>
  <button id="catbtn" onclick="nav('cat')">全部目录</button>
  <button id="catbtn" onclick="showDoubts()">谱上没说清的</button>
  <input id="q" placeholder="搜">
  <span id="qhint"></span>
</div>

<div id="main">
  <section id="subject"><div id="col"><div id="body"></div><div id="results" class="hide"></div></div></section>
</div>

<div id="raw"><div class="src">谱上原文</div><pre id="rawtext">从上面搜一个名字开始。</pre></div>

<script type="module" src="app.js"></script>
